name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Advisories are published against code that has not changed, so a
    # push-triggered run alone would not surface them.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installed from a checksum-verified release rather than via
      # cargo-deny-action, so auditing the dependency graph does not itself add
      # a third-party action to the trusted set.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          install -m 0755 cargo-deny /usr/local/bin/cargo-deny

      - name: Check advisories, bans, licenses and sources
        run: cargo-deny --locked --manifest-path Cargo.toml check
