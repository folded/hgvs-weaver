[package]
name = "hgvs-weaver"
version = "0.4.1"
edition = "2021"
authors = ["The folded team"]
description = "High-performance HGVS variant mapping and validation engine."
license = "Apache-2.0"
repository = "https://github.com/folded/hgvs-weaver"
readme = "../README.md"
keywords = ["hgvs", "variant", "bioinformatics", "genomics", "mapping"]
categories = ["science"]

# Floors match Cargo.lock; see the note in the workspace root manifest.
[dependencies]
pest = "2.8.6"
pest_derive = "2.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dyn-clone = "1.0.20"
